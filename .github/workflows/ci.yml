name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/momchilbg

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - run: pnpm lint
      - run: pnpm check-types
      - run: pnpm audit

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [web, api]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/memory-map-${{ matrix.app }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}/memory-map-{1}:latest', env.REGISTRY, matrix.app) || '' }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: api
            hook: RENDER_DEPLOY_HOOK_API
          - app: web
            hook: RENDER_DEPLOY_HOOK_WEB
    steps:
      # Render pulls the image this run just pushed, pinned to the commit.
      - name: Deploy ${{ matrix.app }} to Render
        env:
          DEPLOY_HOOK: ${{ secrets[matrix.hook] }}
          IMAGE: ${{ env.REGISTRY }}/memory-map-${{ matrix.app }}:${{ github.sha }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::Secret ${{ matrix.hook }} is not set"
            exit 1
          fi
          curl --fail --silent --show-error --get "$DEPLOY_HOOK" --data-urlencode "imgURL=$IMAGE"
