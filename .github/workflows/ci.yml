name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/momchilbg

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - run: pnpm lint
      - run: pnpm check-types
      - run: pnpm audit

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [web, api]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/memory-map-${{ matrix.app }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}/memory-map-{1}:latest', env.REGISTRY, matrix.app) || '' }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

  # Runs the images this workflow just pushed, together with a database, and
  # drives the web app in a real browser.
  e2e:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --user 1001
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: memory_map
        options: >-
          --health-cmd "pg_isready -U postgres -d memory_map"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      api:
        image: ghcr.io/momchilbg/memory-map-api:${{ github.sha }}
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          DATABASE_URL: postgres://postgres:postgres@db:5432/memory_map
      web:
        image: ghcr.io/momchilbg/memory-map-web:${{ github.sha }}
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          API_URL: http://api:3000
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter e2e...
      - name: Wait for the api and web containers
        run: |
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors http://api:3000 > /dev/null
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors http://web:3000 > /dev/null
      - run: pnpm --filter e2e test:e2e
        env:
          BASE_URL: http://web:3000
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 14

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, build, e2e]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: api
            hook: RENDER_DEPLOY_HOOK_API
          - app: web
            hook: RENDER_DEPLOY_HOOK_WEB
    steps:
      # Render pulls the image this run just pushed, pinned to the commit.
      - name: Deploy ${{ matrix.app }} to Render
        env:
          DEPLOY_HOOK: ${{ secrets[matrix.hook] }}
          IMAGE: ${{ env.REGISTRY }}/memory-map-${{ matrix.app }}:${{ github.sha }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::Secret ${{ matrix.hook }} is not set"
            exit 1
          fi
          curl --fail --silent --show-error --get "$DEPLOY_HOOK" --data-urlencode "imgURL=$IMAGE"
