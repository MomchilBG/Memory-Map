# Render Blueprint: https://render.com/docs/blueprint-spec
# Both services run the images that CI builds and pushes to GHCR. CI triggers
# each deploy through the service's deploy hook, pinned to the commit's image.
services:
  - type: web
    name: memory-map-api
    runtime: image
    image:
      url: ghcr.io/momchilbg/memory-map-api:latest
    plan: free
    region: frankfurt
    healthCheckPath: /
    envVars:
      # The Neon connection string; set it in the Render dashboard.
      - key: DATABASE_URL
        sync: false

  - type: web
    name: Memory-Map
    runtime: image
    image:
      url: ghcr.io/momchilbg/memory-map-web:latest
    plan: free
    region: frankfurt
    envVars:
      # The public URL: free web services cannot receive private network traffic.
      - key: API_URL
        value: https://memory-map-api.onrender.com
